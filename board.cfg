MCU_MODEL = STM32F407V(E-G)Tx
CHIBIOS_VERSION = 3.0

HEADER
/*
 * Board identifier.
 */
#define BOARD_DEVBOARDM4
#define BOARD_NAME                  "DevboardM4 V2.1"

/*
 * Board oscillators-related settings.
 */
#if !defined(STM32_LSECLK)
#define STM32_LSECLK                32768U
#endif

#if !defined(STM32_HSECLK)
#define STM32_HSECLK                16000000U
#endif

/*
 * Board voltages.
 * Required for performance limits calculation.
 */
#define STM32_VDD                   300U

/*
 * MCU type as defined in the ST header.
 */
#define STM32F407xx


CONFIG
# PIN NAME PERIPH_TYPE AF_NUMBER or
# PIN NAME FUNCTION PP_or_OPENDRAIN PIN_SPEED PULL_RESISTOR INITIAL_LEVEL AF_NUMBER
# SPEED : SPEED_VERYLOW, SPEED_LOW, SPEED_MEDIUM, SPEED_HIGH
#
# SYSTEM
A13 	SWDIO	  SYS  AF:SYS_JTMS-SWDIO
A14 	SWCLK	  SYS  AF:SYS_JTCK-SWCLK
C14 	OSC32_IN  SYS  AF:RCC_OSC32_IN
C15 	OSC32_OUT SYS  AF:RCC_OSC32_OUT
H00 	OSC_IN    SYS  AF:RCC_OSC_IN
H01 	OSC_OUT   SYS  AF:RCC_OSC_OUT

#DEFAULT
DEFAULT                      INPUT   PULLDOWN

# ACTIVE PINS
PB06    SHELL_TX	UART	AF:USART1_TX
PB07    SHELL_RX	UART	AF:USART1_RX
PC00    LED0            OUTPUT  PUSHPULL   SPEED_VERYLOW FLOATING LEVEL_HIGH 
PC01	POTAR_BOUTON	ADC	ADC1_IN11
PC02	POTAR_BOUTON2	ADC	ADC1_IN12
